<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Form Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .captcha-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }

        .captcha-image {
            width: 100%;
            max-width: 250px;
            height: 80px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 12px;
            cursor: pointer;
            display: block;
        }

        .captcha-image:hover {
            opacity: 0.8;
        }

        .refresh-button {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 12px;
            transition: background 0.2s ease;
        }

        .refresh-button:hover {
            background: #5a6268;
        }

        .captcha-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .captcha-input-wrapper input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .helper-text {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Form with CAPTCHA</h1>

        <div class="message" id="message"></div>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Your message..."></textarea>
            </div>

            <div class="form-group">
                <label>Security Verification</label>
                <div class="captcha-container">
                    <img src="captcha-generator.php" alt="CAPTCHA" class="captcha-image" id="captchaImage">
                    <button type="button" class="refresh-button" id="refreshCaptcha">
                        🔄 Refresh CAPTCHA
                    </button>
                    <div class="captcha-input-wrapper">
                        <input type="text" id="captcha" name="captcha" 
                               placeholder="Enter code above" 
                               maxlength="6" 
                               required>
                    </div>
                    <div class="helper-text">Enter the text shown in the image above</div>
                </div>
            </div>

            <button type="submit" class="submit-button">
                <span id="submitText">Submit Form</span>
                <div class="loading" id="loading">
                    <span class="spinner"></span>Verifying...
                </div>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const captchaImage = document.getElementById('captchaImage');
        const refreshBtn = document.getElementById('refreshCaptcha');
        const captchaInput = document.getElementById('captcha');
        const messageDiv = document.getElementById('message');
        const loading = document.getElementById('loading');
        const submitText = document.getElementById('submitText');

        // Refresh CAPTCHA image
        refreshBtn.addEventListener('click', function(e) {
            e.preventDefault();
            // Add timestamp to bust cache
            captchaImage.src = 'captcha-generator.php?t=' + Date.now();
            captchaInput.value = '';
            captchaInput.focus();
            hideMessage();
        });

        // Click image to refresh
        captchaImage.addEventListener('click', function() {
            refreshBtn.click();
        });

        // Handle form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            // Show loading state
            loading.style.display = 'inline';
            submitText.style.display = 'none';

            try {
                // Verify CAPTCHA
                const captchaResponse = await fetch('captcha-verify.php', {
                    method: 'POST',
                    body: new FormData(form)
                });

                const captchaResult = await captchaResponse.json();

                if (!captchaResult.valid) {
                    showMessage(captchaResult.message, 'error');
                    // Refresh CAPTCHA for security
                    refreshBtn.click();
                    loading.style.display = 'none';
                    submitText.style.display = 'inline';
                    return;
                }

                // If CAPTCHA is valid, submit the form
                showMessage('Form submitted successfully! (Demo mode - no backend processing)', 'success');

                // Reset form
                setTimeout(() => {
                    form.reset();
                    refreshBtn.click();
                    loading.style.display = 'none';
                    submitText.style.display = 'inline';
                }, 2000);

            } catch (error) {
                showMessage('An error occurred. Please try again.', 'error');
                loading.style.display = 'none';
                submitText.style.display = 'inline';
                console.error('Error:', error);
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }

        function hideMessage() {
            messageDiv.style.display = 'none';
        }

        // Auto-uppercase CAPTCHA input
        captchaInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        // Load initial CAPTCHA on page load
        window.addEventListener('load', function() {
            captchaImage.src = 'captcha-generator.php?t=' + Date.now();
        });
    </script>
</body>
</html>
