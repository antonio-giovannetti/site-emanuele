<div class="controls">
    <span>{{_aud}}</span>

@if(play) {
    <i class="fa-solid fa-pause" (click)="pauseSound()"></i>
} @else {
    <i class="fa-solid fa-play" (click)="playSound()"></i>
}
    <i class="fa-solid fa-forward" (click)="next()"></i>
</div>
<audio #audioPlayer [autoplay]="play">
    <source [src]="'assets/audio/'+_aud" type="audio/mpeg" loop="true" />
</audio>
