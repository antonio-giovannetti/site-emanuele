<section class="process">
    <div class="container">
        <h2>Come lavoro</h2>
        <div class="process-steps">
            @for (step of processSteps; track $index) {
                <div class="step">
                    <div class="step-number">{{$index + 1}}</div>
                    <h3>{{step.title}}</h3>
                    <p>{{step.description}}</p>
                </div>
            }
        </div>
    </div>
</section>
