<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
    <!-- Soft background -->
    <rect width="500" height="400" fill="#F8F6F2" rx="20" />

    <!-- Subtle grounding circle -->
    <circle cx="250" cy="200" r="145" fill="none" stroke="#E8E2D8" stroke-width="2" />

    <!-- LETTER E (Bold, perfectly defined) -->
    <!-- Vertical Stem -->
    <rect x="110" y="95" width="38" height="210" rx="4" fill="#1E3A5F" />
    <!-- Top Bar -->
    <rect x="110" y="95" width="105" height="38" rx="4" fill="#1E3A5F" />
    <!-- Middle Bar -->
    <rect x="110" y="181" width="85" height="38" rx="4" fill="#1E3A5F" />
    <!-- Bottom Bar -->
    <rect x="110" y="267" width="105" height="38" rx="4" fill="#1E3A5F" />

    <!-- LETTER C (Bold, perfectly defined crescent) -->
    <!-- Outer curve (Right side) and Inner curve (Left side) form a clear C -->
    <path d="M 355 100 A 92 92 0 1 0 355 300 L 322 300 A 60 60 0 1 1 322 100 Z" fill="#B58B6C" />

    <!-- The "Analytic Focus" dot in the space between the letters -->
    <circle cx="266" cy="200" r="7" fill="#B58B6C" />
</svg>
<hr />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
        <!-- Mask that cuts the letters out of the background -->
        <mask id="cutoutMask">
            <!-- White means "keep everything" -->
            <rect width="400" height="400" fill="white" />
            <!-- Black means "cut a hole here" -->
            <!-- LETTER E Cutout -->
            <rect x="110" y="95" width="35" height="210" fill="black" rx="4" />
            <rect x="110" y="95" width="100" height="35" fill="black" rx="4" />
            <rect x="110" y="182" width="80" height="35" fill="black" rx="4" />
            <rect x="110" y="270" width="100" height="35" fill="black" rx="4" />
            <!-- LETTER C Cutout -->
            <path d="M 340 100 A 90 90 0 1 0 340 300 L 310 300 A 60 60 0 1 1 310 100 Z" fill="black" />
        </mask>
    </defs>

    <!-- Solid Deep Navy Background -->
    <rect width="400" height="400" fill="#1E3A5F" rx="25" />

    <!-- The Warm Beige shape revealed through the perfectly defined letter holes -->
    <rect width="400" height="400" fill="#E8DCCC" mask="url(#cutoutMask)" rx="25" />
</svg>

<hr />
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
    <!-- Clean white/cream background -->
    <rect width="500" height="400" fill="#FCFAF7" rx="15" />

    <!-- LETTER E with Serifs (Classic academic style) -->
    <g fill="#2C2C2C">
        <!-- Main vertical block -->
        <rect x="110" y="90" width="30" height="220" />
        <!-- Top, Middle, Bottom bars -->
        <rect x="110" y="90" width="110" height="30" />
        <rect x="110" y="185" width="80" height="30" />
        <rect x="110" y="280" width="110" height="30" />

        <!-- Decorative Serifs for E -->
        <rect x="95" y="80" width="20" height="15" />   <!-- Top Left -->
        <rect x="200" y="80" width="20" height="15" />  <!-- Top Right -->
        <rect x="95" y="275" width="20" height="15" />  <!-- Bottom Left -->
        <rect x="200" y="275" width="20" height="15" /> <!-- Bottom Right -->
        <rect x="180" y="175" width="15" height="20" /> <!-- Middle Right -->
    </g>

    <!-- LETTER C with Serifs -->
    <g fill="#2C2C2C">
        <!-- The main thick C curve -->
        <path d="M 380 100 A 95 95 0 1 0 380 300" fill="none" stroke="#2C2C2C" stroke-width="32" stroke-linecap="square" />

        <!-- Decorative Serifs for C -->
        <rect x="370" y="82" width="20" height="18" />   <!-- Top Serif -->
        <rect x="370" y="300" width="20" height="18" />  <!-- Bottom Serif -->
    </g>
</svg>
