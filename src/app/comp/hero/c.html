<section id="hero" class="hero">
    <video #videoPlayer class="video-background" [autoplay]="autoplay" muted loop>
<!--        <source src="assets/output.webm" type="video/webm">-->
        <source src="assets/video/7521690-hd_1920_1080_25fps.mp4.webm" type="video/webm">
    </video>
    @if (!!af) {
        <div class="hero-quote">
            <p class="hero-quote-text">"{{ af.text }}"</p>
            <span class="hero-quote-author">— {{ af.author }}</span>
        </div>
    }

    <div class="container">
        <div class="hero-content">
            <h1>{{ site?.title }}</h1>
            <p>{{ site?.titolare!.description }}</p>
            <button class="btn btn-primary" (click)="scrollToSection('contact')">Prenota una sessione</button>
        </div>
    </div>
</section>
